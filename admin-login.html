<!DOCTYPE html>
<html>
<head>
<title>Admin Login</title>

<style>
* {
  margin: 0;
  padding: 0;
  font-family: Arial;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(-45deg, #0a192f, #112240, #1a2e4a);
  background-size: 400% 400%;
  animation: move 10s infinite;
}

.container {
  background: rgba(255,255,255,0.08);
  padding: 40px;
  border-radius: 20px;
  backdrop-filter: blur(15px);
  text-align: center;
  width: 300px;
}

input, button {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  border: none;
}

button {
  background: linear-gradient(to right, #64ffda, #3ddc97);
  font-weight: bold;
  cursor: pointer;
}

a {
  color: #64ffda;
  display: block;
  margin-top: 10px;
}

@keyframes move {
  0% { background-position: 0% }
  50% { background-position: 100% }
  100% { background-position: 0% }
}
</style>
</head>

<body>

<div class="container">
  <h2 style="color:#64ffda;">Admin Login</h2>

  <input id="admin" type="text" placeholder="Admin">
  <input id="pass" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <a href="/">User Login</a>
</div>

<script>
async function login() {
  const admin = document.getElementById("admin").value;
  const password = document.getElementById("pass").value;

  const res = await fetch("/api/admin-login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ admin, password })
  });

  const data = await res.json();

  if (data.success) {
    window.location.href = "/dashboard";
  } else {
    alert("Invalid admin ❌");
  }
}
</script>

</body>
</html>
