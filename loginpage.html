<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
* {
  margin: 0;
  padding: 0;
  font-family: Arial;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(-45deg, #0a192f, #112240, #1a2e4a);
  background-size: 400% 400%;
  animation: move 10s infinite;
}

.container {
  background: rgba(255,255,255,0.08);
  padding: 40px;
  border-radius: 20px;
  backdrop-filter: blur(15px);
  text-align: center;
  width: 300px;
}

input, button {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  border: none;
}

button {
  background: linear-gradient(to right, #64ffda, #3ddc97);
  font-weight: bold;
  cursor: pointer;
}

a {
  color: #64ffda;
  display: block;
  margin-top: 10px;
}

@keyframes move {
  0% { background-position: 0% }
  50% { background-position: 100% }
  100% { background-position: 0% }
}
</style>
</head>

<body>

<div class="container">
  <h2 style="color:#64ffda;">User Login</h2>

  <!-- Inputs -->
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <!-- Button -->
  <button onclick="login()">Login</button>

  <!-- Admin Link -->
  <a href="/admin">Admin Login</a>
</div>

<script>
async function login() {
  // ✅ Correct way to get input values
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (data.success) {
      alert("Login successful ✅");
      // ✅ Redirect using backend route
      window.location.href = "/home";
    } else {
      alert("Invalid login ❌");
    }

  } catch (err) {
    console.error(err);
    alert("Server error ❌");
  }
}
</script>

</body>
</html>
